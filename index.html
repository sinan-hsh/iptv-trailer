<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>IPTV+ трейлър</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #p, iframe#p { position: absolute; top: 0; left: 0; width: 100vw !important; height: 100vh !important; border: 0; }
  #msg:empty { display: none; }
  #msg { pointer-events: none; position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; justify-content: center; color: #ccc; font: 28px sans-serif; text-align: center; padding: 0 10%; }
</style>
</head>
<body>
<div id="p"></div>
<div id="msg"></div>
<script>
/* Плейърът за трейлърите на IPTV+ (телевизорът).
   YouTube пуска вградено видео само от страница с уеб адрес – приложението на телевизора се зарежда от файл,
   затова го вгражда през тази страница. Адресът: ?v=<ключ на видеото в YouTube> (&c=0 – без бутоните на YouTube; &a=0 – подготовка: без звук до първия кадър, после пауза в началото -> { iptv: 'ready' }).
   Командите идват от приложението (postMessage): { iptv: 'cmd', f, a: [...] } – playVideo, pauseVideo, seekTo,
   loadVideoById, setVolume, mute, unMute, setPlaybackRate; 'cc' [език] / [] – субтитри (YouTube не дава списъка
   им през API – плейърът се създава наново със cc_load_policy/cc_lang_pref оттам, докъдето е стигнал).
   Обратно – { iptv: 'st', time, state, dur, rate, vol, muted, cc } на всяка половин секунда,
   { iptv: 'end' } в края и { iptv: 'err', code } при грешка. */
(function () {
  var q = new URLSearchParams(location.search), v = (q.get('v') || '').replace(/[^\w-]/g, '');
  var msg = document.getElementById('msg'), player = null, ccOn = '', keep = { rate: 1, vol: 100, muted: false }, pre = q.get('a') === '0';
  if (!v) { msg.textContent = 'Няма видео'; return; }
  function up(o) { o.iptv = o.iptv || 'st'; try { parent.postMessage(o, '*'); } catch (e) { /* */ } }
  // размерът – от самото начало на цял екран: YouTube избира качеството по размера при създаването
  // (по подразбиране 640×390 – тогава е ниско качество и кръгчето „зарежда“ е горе вляво)
  function make(start) {
    var pv = { autoplay: 1, controls: q.get('c') === '0' ? 0 : 1, vq: 'hd1080', rel: 0, playsinline: 1, origin: location.origin,
      cc_load_policy: ccOn ? 1 : 0, start: Math.floor(start || 0) };
    if (ccOn) { pv.cc_lang_pref = ccOn; pv.hl = ccOn; }
    player = new YT.Player('p', {
      videoId: v, width: '100%', height: '100%', host: 'https://www.youtube-nocookie.com', playerVars: pv,
      events: {
        onReady: function (e) {
          var p = e.target;
          try { p.setPlaybackQuality('hd1080'); } catch (x) { /* */ }
          // след смяна на субтитрите – скоростта и звукът остават
          if (keep.rate !== 1) p.setPlaybackRate(keep.rate);
          p.setVolume(keep.vol); if (keep.muted) p.mute();
          // &a=0 – подготовка отзад (приложението още е в информацията): тръгва без звук, взима началото
          // и спира в началото – при „пусни“ тръгва веднага
          if (pre) { p.mute(); }
          p.playVideo();
        },
        onPlaybackQualityChange: function (e) { up({ iptv: 'q', q: e.data }); },
        // свърши – казваме веднага (приложението затваря и се връща в информацията)
        onStateChange: function (e) {
          if (e.data === 0) up({ iptv: 'end' });
          if (pre && e.data === 1) {
            pre = false;
            e.target.pauseVideo(); e.target.seekTo(0, true);
            if (!keep.muted) e.target.unMute();
            up({ iptv: 'ready' });
          }
        },
        onError: function (e) { up({ iptv: 'err', code: e.data }); }
      }
    });
  }
  function cc(lang) {
    lang = String(lang || '').replace(/[^\w-]/g, '');
    if (lang === ccOn || !player) return;
    var t = 0;
    try { t = player.getCurrentTime(); keep = { rate: player.getPlaybackRate(), vol: player.getVolume(), muted: player.isMuted() }; player.destroy(); } catch (e) { /* */ }
    ccOn = lang;
    var d = document.createElement('div'); d.id = 'p';
    var old = document.getElementById('p'); if (old) old.parentNode.replaceChild(d, old); else document.body.insertBefore(d, msg);
    make(t);
  }
  window.onYouTubeIframeAPIReady = function () {
    make(0);
    setInterval(function () {
      if (!player || !player.getCurrentTime) return;
      up({ time: player.getCurrentTime(), state: player.getPlayerState(), dur: player.getDuration(),
        rate: player.getPlaybackRate ? player.getPlaybackRate() : 1, vol: player.getVolume ? player.getVolume() : 100, muted: player.isMuted ? player.isMuted() : false, cc: ccOn });
    }, 500);
  };
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.iptv !== 'cmd' || !player) return;
    if (d.f === 'cc') { cc((d.a || [])[0]); return; }
    // „пусни“ от приложението – и ако подготовката още не е стигнала до първия кадър (тогава не спираме)
    if (d.f === 'go') { pre = false; try { if (!keep.muted) player.unMute(); player.playVideo(); } catch (x) { /* */ } return; }
    if (d.f === 'loadVideoById') { v = String((d.a || [])[0] || '').replace(/[^\w-]/g, ''); }
    if (typeof player[d.f] !== 'function') return;
    if (['playVideo', 'pauseVideo', 'seekTo', 'loadVideoById', 'setVolume', 'mute', 'unMute', 'setPlaybackRate'].indexOf(d.f) < 0) return;
    player[d.f].apply(player, d.a || []);
  });
  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
})();
</script>
</body>
</html>
