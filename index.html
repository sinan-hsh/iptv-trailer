<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://www.youtube-nocookie.com">
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preconnect" href="https://www.google.com">
<title>IPTV+ трейлър</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; border: 0; }
</style>
</head>
<body>
<script>
/* Плейърът за трейлърите на IPTV+ (телевизорът).
   YouTube пуска вградено видео само от страница с уеб адрес – приложението на телевизора се зарежда от файл,
   затова го вгражда през тази страница. Плейърът се слага направо (iframe към embed) – без скрипта iframe_api
   и неговия втори скрипт: на телевизора всяка стъпка е бавна. Говорим с него по неговия протокол (postMessage).
   Адресът: ?v=<ключ на видеото в YouTube> (&c=0 – без бутоните на YouTube, &m=1 – без звук от самото начало:
   фоновият трейлър в информацията – иначе звукът се чува, докато командата mute стигне до плейъра).
   v2: &a=0 – само подготвен плейър (не тръгва); 'load' [ключ, начало, без звук] – друго видео в същия плейър;
   'stopVideo' – пауза. Щом се зареди, страницата казва { iptv: 'hello', v: 2 }.
   Командите от приложението: { iptv: 'cmd', f, a: [...] } – playVideo, pauseVideo, seekTo, loadVideoById,
   setVolume, mute, unMute, setPlaybackRate; 'cc' [език] / [] – субтитри (YouTube не дава списъка им през
   API – плейърът се зарежда наново със cc_load_policy/cc_lang_pref оттам, докъдето е стигнал).
   Обратно – { iptv: 'st', time, state, dur, rate, vol, muted, cc } на всяка половин секунда,
   { iptv: 'q', q } при смяна на качеството, { iptv: 'end' } в края и { iptv: 'err', code } при грешка. */
(function () {
  var YT = 'https://www.youtube-nocookie.com';
  var q = new URLSearchParams(location.search), v = (q.get('v') || '').replace(/[^\w-]/g, '');
  var fr = null, ccOn = '', st = {}, keep = { rate: 1, vol: 100, muted: q.get('m') === '1' }, ready = false, auto = q.get('a') !== '0';
  if (!v) return;
  function up(o) { o.iptv = o.iptv || 'st'; try { parent.postMessage(o, '*'); } catch (e) { /* */ } }
  function send(o) { try { fr.contentWindow.postMessage(JSON.stringify(o), YT); } catch (e) { /* още се зарежда */ } }
  function cmd(f, a) { send({ event: 'command', func: f, args: a || [], id: 1, channel: 'widget' }); }
  function url(start) {
    var p = 'autoplay=' + (auto ? 1 : 0) + '&controls=' + (q.get('c') === '0' ? 0 : 1) + '&rel=0&playsinline=1&iv_load_policy=3&enablejsapi=1&origin=' + encodeURIComponent(location.origin);
    if (keep.muted) p += '&mute=1';
    if (start) p += '&start=' + Math.floor(start);
    if (ccOn) p += '&cc_load_policy=1&cc_lang_pref=' + ccOn + '&hl=' + ccOn;
    return YT + '/embed/' + v + '?' + p;
  }
  function noCc() {
    cmd('unloadModule', ['captions']); cmd('unloadModule', ['cc']);
    cmd('setOption', ['captions', 'track', {}]);
  }
  function make(start) {
    if (fr && fr.parentNode) fr.parentNode.removeChild(fr);
    ready = false;
    fr = document.createElement('iframe');
    fr.setAttribute('allow', 'autoplay; encrypted-media; fullscreen');
    fr.src = url(start);
    // плейърът праща състоянието си чак след като му кажем, че слушаме
    fr.onload = function () { send({ event: 'listening', id: 1, channel: 'widget' }); };
    document.body.appendChild(fr);
  }
  window.addEventListener('message', function (e) {
    if (e.origin !== YT) {   // от приложението
      var c = e.data;
      if (!c || c.iptv !== 'cmd') return;
      if (c.f === 'cc') {
        var l = String((c.a || [])[0] || '').replace(/[^\w-]/g, '');
        if (l === ccOn) return;
        keep = { rate: st.rate || 1, vol: st.vol == null ? 100 : st.vol, muted: !!st.muted };
        ccOn = l; make(st.time || 0);
      } else if (c.f === 'load') {
        // v2: друго видео в СЪЩИЯ плейър – без да се зарежда наново (приложението държи страницата готова:
        // фонов трейлър в информацията без 2–3 s тежко зареждане на всяко отваряне). [ключ, начало, без звук]
        v = String((c.a || [])[0] || '').replace(/[^\w-]/g, ''); st = {}; auto = true;
        if (c.a && c.a[2] != null) keep.muted = !!c.a[2];
        if (!v) return;
        if (fr && ready) { if (keep.muted) cmd('mute'); cmd('loadVideoById', [v, +(c.a[1] || 0)]); if (!ccOn) noCc(); }
        else make(+(c.a[1] || 0));
      } else if (c.f === 'stopVideo') { cmd('pauseVideo'); st = {};
      } else if (c.f === 'loadVideoById') {
        v = String((c.a || [])[0] || '').replace(/[^\w-]/g, ''); st = {}; make(0);
      } else if (['playVideo', 'pauseVideo', 'seekTo', 'setVolume', 'mute', 'unMute', 'setPlaybackRate'].indexOf(c.f) >= 0) cmd(c.f, c.a || []);
      return;
    }
    var d; try { d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (x) { return; }
    if (!d || !d.event) return;
    if (d.event === 'onReady') {
      ready = true;
      if (!auto) { if (keep.muted) cmd('mute'); return; }   // само подготвен (&a=0) – чака „load“
      // след смяна на субтитрите – скоростта и звукът остават
      if (keep.rate !== 1) cmd('setPlaybackRate', [keep.rate]);
      cmd('setVolume', [keep.vol]); if (keep.muted) cmd('mute');
      // субтитри „Изкл.“ – YouTube иначе пуска своите по предпочитанието в бисквитката (напр. английски
      // върху вградените турски); махаме модула им. При избран език – само той (cc_lang_pref)
      if (!ccOn) noCc();
      cmd('playVideo');
    }
    // фонът (&m=1) – никакви субтитри: YouTube зарежда модула им наново при пускане/скок, затова се маха всеки път
    if (d.event === 'onStateChange' && d.info === 1 && keep.muted && !ccOn) noCc();
    if (d.event === 'onStateChange' && d.info === 0) up({ iptv: 'end' });   // свърши – приложението затваря
    if (d.event === 'onError') up({ iptv: 'err', code: d.info });
    if (d.event === 'onPlaybackQualityChange') up({ iptv: 'q', q: d.info });
    if (d.event === 'infoDelivery' && d.info) {
      var i = d.info;
      if (i.currentTime != null) st.time = i.currentTime;
      if (i.duration != null) st.dur = i.duration;
      if (i.playerState != null) st.state = i.playerState;
      if (i.playbackRate != null) st.rate = i.playbackRate;
      if (i.volume != null) st.vol = i.volume;
      if (i.muted != null) st.muted = i.muted;
      if (i.playbackQuality && i.playbackQuality !== st.q) { st.q = i.playbackQuality; up({ iptv: 'q', q: st.q }); }
    }
  });
  setInterval(function () {
    if (keep.muted && !ccOn && st.state === 1) noCc();   // фон – субтитрите не се връщат
    up({ time: st.time || 0, state: st.state == null ? -1 : st.state, dur: st.dur || 0, rate: st.rate || 1, vol: st.vol == null ? 100 : st.vol, muted: !!st.muted, cc: ccOn });
  }, 500);
  up({ iptv: 'hello', v: 2 });   // приложението разбира, че страницата знае „load“
  make(0);
})();
</script>
</body>
</html>
